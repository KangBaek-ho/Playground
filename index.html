<div id="hint">파란 구간을 누르면 로드뷰로 이동해요 · 스크롤로 확대·축소, 드래그로 이동</div>
<script>
const POLYS = {"1": "651,722 652,699 655,696 657,696 659,697 662,700 662,708 661,732 660,742 657,745 654,745 651,742", "2": "612,680 613,678 616,675 650,686 659,689 662,692 662,693 661,696 658,699 656,699 634,692 616,686 612,682", "3": "577,685 577,682 580,679 587,678 605,676 611,676 614,679 614,681 611,684 609,685 602,686 585,688 580,688", "4": "541,690 541,687 544,684 547,683 572,680 576,680 579,683 579,686 576,689 555,692 545,693 544,693", "5": "520,686 537,684 540,684 543,687 544,689 544,690 541,693 535,694 526,695 518,695 515,692 515,690 518,687", "6": "514,697 492,700 489,697 489,694 492,691 494,690 501,689 511,688 514,688 517,691 517,694", "7": "463,699 462,697 465,694 467,693 474,692 484,691 488,691 491,694 491,697 488,700 472,702 466,702", "8": "441,724 438,721 454,703 460,697 461,697 466,702 466,703 464,706 455,716 445,726", "9": "453,713 447,719 443,715 440,711 430,697 426,691 426,690 431,685 432,685 437,690 452,711", "10": "445,725 445,760 442,763 440,763 437,760 437,725 440,722 442,722", "11": "437,800 437,764 440,761 442,761 445,764 445,801 442,804 440,803", "12": "445,804 445,831 442,834 440,834 437,831 437,804 440,801 442,801", "13": "445,835 445,886 442,889 440,889 437,886 437,835 440,832 442,832", "14": "430,894 433,890 437,886 441,886 444,889 444,890 441,894 438,897 433,897", "15": "435,904 428,904 425,901 425,897 428,894 435,894 438,897 438,901", "16": "423,904 417,904 414,901 414,897 417,894 423,894 426,897 426,901", "17": "412,904 399,904 396,901 396,897 399,894 412,894 415,897 415,901", "18": "396,904 383,904 380,901 380,897 383,894 396,894 399,897 399,901", "19": "380,904 367,904 364,901 364,897 367,894 380,894 383,897 383,901", "20": "366,897 366,914 363,917 360,917 357,914 357,897 360,894 363,894"};
const VIEWER = 'https://kangbaek-ho.github.io/PlaygroundStreet-View/';   // 로드뷰 주소 (바꾸려면 여기만 수정)
const MW=1110, MH=990, ZMIN=1, ZMAX=14;
const stage=document.getElementById('stage'), map=document.getElementById('map'), hint=document.getElementById('hint');
let base=1, z=1, tx=0, ty=0, moved=0;

/* 파란 칸 (눌러서 이동) */
const g=document.getElementById('cells');
Object.entries(POLYS).forEach(([n,pts])=>{
  const p=document.createElementNS('http://www.w3.org/2000/svg','polygon');
  p.setAttribute('points',pts); p.setAttribute('class','cell');
  p.addEventListener('click',()=>{ if(moved>6) return; location.href = VIEWER + '#' + n; });   // 같은 탭이라 뒤로 가기를 누르면 지도로 돌아와요
  g.appendChild(p);
});

/* 확대·축소·이동 */
function clamp(){
  const vw=innerWidth, vh=innerHeight, W=MW*base*z, H=MH*base*z;
  tx = W<=vw ? (vw-W)/2 : Math.min(0, Math.max(vw-W, tx));
  ty = H<=vh ? (vh-H)/2 : Math.min(0, Math.max(vh-H, ty));
}
function apply(){ clamp(); map.style.transform=`translate(${tx}px,${ty}px) scale(${z})`; }
function fit(){
  base=Math.min(innerWidth/MW, innerHeight/MH);
  map.style.width=(MW*base)+'px'; map.style.height=(MH*base)+'px';
}
function zoomAt(nz,cx,cy){
  nz=Math.min(ZMAX,Math.max(ZMIN,nz)); if(nz===z) return;
  const fx=(cx-tx)/z, fy=(cy-ty)/z;     // 커서 아래 지점을 고정
  z=nz; tx=cx-fx*z; ty=cy-fy*z; apply();
}
stage.addEventListener('wheel',e=>{ e.preventDefault(); zoomAt(z*Math.exp(-e.deltaY*0.0015),e.clientX,e.clientY); hint.style.opacity=0; },{passive:false});

const ptrs=new Map(); let down=false,sx=0,sy=0,stx=0,sty=0,pinch=null;
function pinchInfo(){ const [a,b]=[...ptrs.values()]; return {d:Math.hypot(a.x-b.x,a.y-b.y)||1,cx:(a.x+b.x)/2,cy:(a.y+b.y)/2}; }
stage.addEventListener('pointerdown',e=>{
  hint.style.opacity=0; ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===2){ down=false; moved=999; pinch={d:pinchInfo().d,z}; stage.classList.remove('dragging'); return; }
  if(ptrs.size>2) return;
  down=true; moved=0; sx=e.clientX; sy=e.clientY; stx=tx; sty=ty; stage.classList.add('dragging');
});
addEventListener('pointermove',e=>{
  if(ptrs.has(e.pointerId)) ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pinch&&ptrs.size>=2){ const p=pinchInfo(); zoomAt(pinch.z*p.d/pinch.d,p.cx,p.cy); return; }
  if(!down) return;
  const dx=e.clientX-sx, dy=e.clientY-sy; moved=Math.max(moved,Math.hypot(dx,dy));
  tx=stx+dx; ty=sty+dy; apply();
});
function release(e){
  ptrs.delete(e.pointerId);
  if(pinch){ if(ptrs.size<2) pinch=null; down=false; stage.classList.remove('dragging'); setTimeout(()=>moved=0,0); return; }
  if(!down) return; down=false; stage.classList.remove('dragging'); setTimeout(()=>moved=0,0);
}
addEventListener('pointerup',release); addEventListener('pointercancel',release);
addEventListener('resize',()=>{ fit(); apply(); });
fit(); apply();
setTimeout(()=>hint.style.opacity=0,6000);
</script>
