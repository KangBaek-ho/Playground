function clamp(){
  const vw=innerWidth, vh=innerHeight, W=MW*base*z, H=MH*base*z;
  tx = W<=vw ? (vw-W)/2 : Math.min(0, Math.max(vw-W, tx));

function apply(){ clamp(); map.style.transform=`translate(${tx}px,${ty}px) scale(${z})`; }
function fit(){
  base=Math.min(innerWidth/MW, innerHeight/MH);

addEventListener('pointermove',e=>{
  if(ptrs.has(e.pointerId)) ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pinch&&ptrs.size>=2){ const p=pinchInfo(); zoomAt(pinch.z*p.d/pinch.d,p.cx,p.cy); return; }
  if(!down) return;
  const dx=e.clientX-sx, dy=e.clientY-sy; moved=Math.max(moved,Math.hypot(dx,dy));
  tx=stx+dx; ty=sty+dy; apply();
});
function release(e){
  ptrs.delete(e.pointerId);
  if(pinch){ if(ptrs.size<2) pinch=null; down=false; stage.classList.remove('dragging'); setTimeout(()=>moved=0,0); return; }
  if(!down) return; down=false; stage.classList.remove('dragging'); setTimeout(()=>moved=0,0);
}
addEventListener('pointerup',release); addEventListener('pointercancel',release);
addEventListener('resize',()=>{ fit(); apply(); });
fit(); apply();
setTimeout(()=>hint.style.opacity=0,6000);
</script>
</body>
